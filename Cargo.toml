[package]
name = "qemulbench"
version = "0.0.1"
edition = "2021"
authors = ["noonomyen <nomyen@noonomyen.com>"]
description = "Standalone self-contained cross-platform Linux benchmark tool"
license = "MIT"

[[bin]]
name = "qemulbench"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
nix = { version = "0.29", features = ["process", "signal"] }
zstd = "0.13"
tempfile = "3.17"
base64 = "0.22"
tar = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
